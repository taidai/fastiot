<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastIOT · 设计工作台 · 玻璃磨砂</title>
<!--
  原型代码，不是产品代码；不接后端，不持久化。
  要回答的问题：上边栏只有总览、设计、交付三个大项时，交付人员能不能从台账树走到接入与策略；
  配界面能不能做成"块目录＋声明式绑定＋槽位版式"（ADR 0009），保存后客户视图按它渲染。
-->
<style>
  :root{
    color-scheme:light;
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --ink:#1a2a33; --muted:#4c5d72; --faint:#6b7f92; --line:#e4e9ee;
    --accent:#0e7c7b; --mint:#23705f; --amber:#8f5f19; --danger:#b23a32;
    --card:rgba(255,255,255,.8);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:linear-gradient(180deg,#eef5f9,#e3edf3);min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer}
  .topbar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:rgba(255,255,255,.78);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
  .brand{font-weight:750;color:var(--accent);letter-spacing:.02em}
  .brand small{font-weight:500;color:var(--faint);margin-left:6px}
  .project{position:relative}
  .project-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:12.5px}
  .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 18px 40px rgba(31,46,58,.16);padding:6px;display:none;z-index:30}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:13px}
  .menu button:hover{background:#f1f7fa}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
  .spacer{flex:1}
  .wb-tabs{display:flex;gap:2px;background:rgba(228,238,244,.65);border:1px solid var(--line);border-radius:11px;padding:3px}
  .wb-tabs button{border:0;background:none;padding:6px 18px;border-radius:8px;font-size:13px;color:var(--muted)}
  .wb-tabs button.active{background:#fff;color:var(--accent);font-weight:650;box-shadow:0 2px 8px rgba(31,46,58,.1)}
  .ems-toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;
    border:1px dashed #b9c8d4;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.5)}
  .acct{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
  .acct.show{display:inline-block}
  .acct:hover{border-color:#bcd7d5;color:var(--accent)}
  .bell{position:relative;display:none;place-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:33px;color:var(--muted)}
  .bell.show{display:grid}
  .bell:hover{border-color:#bcd7d5;color:var(--accent)}
  .bell em{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:9px;font-style:normal;
    border-radius:999px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #edf2f5}
  .statebar{font-size:11.5px;color:var(--faint);padding:6px 18px;border-bottom:1px solid rgba(228,233,238,.7);
    background:rgba(255,255,255,.35);display:flex;gap:10px;flex-wrap:wrap}
  .statebar b{color:var(--muted);font-weight:600}
  .layout{display:grid;grid-template-columns:288px 1fr;min-height:calc(100vh - 92px)}
  .side{border-right:1px solid var(--line);padding:14px 10px 60px;background:rgba(255,255,255,.42)}
  .stage{padding:20px 24px 80px;max-width:1220px}
  .stepper-wrap{position:relative;margin-bottom:16px}
  .stepper{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .stepper .step{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:5px 11px;font-size:12.5px;color:var(--muted)}
  .stepper .step i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#eef4f7;color:var(--faint);
    display:grid;place-items:center;font-size:10px}
  .stepper .step.done i{background:#e6f3ee;color:var(--mint)}
  .stepper .step.active{border-color:var(--accent);color:var(--accent);background:#f1faf9}
  .stepper .step.active i{background:var(--accent);color:#fff}
  .stepper em{color:#c3d0da;font-style:normal;margin:0 2px}
  .step-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .step-head b{font-size:16px}
  .step-head span{font-size:12.5px;color:var(--faint)}
  .primary{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:8px 15px;font-size:13px}
  .primary:hover{background:#0b6a69}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;color:var(--muted)}
  .tool-links{margin:12px 0 0;font-size:12px;color:var(--faint)}
  .tool-links button{border:0;background:none;color:var(--accent);font-size:12px;padding:0 5px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .pv{border:1px dashed #c9d6e0;border-radius:10px;padding:12px;background:#f8fbfc;font-size:12px;color:var(--faint);display:flex;flex-direction:column;gap:4px}
  .pv b{color:var(--ink);font-size:12.5px}
  .opts{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px}
  .opts label{display:flex;align-items:center;gap:5px}
  .card h5{margin:0 0 10px;font-size:12px;color:var(--faint);letter-spacing:.06em;font-weight:600}
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .metric{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;text-align:left}
  .metric span{font-size:11px;color:var(--faint)}
  .metric b{font-size:18px}
  .metric b em{font-size:11px;font-style:normal;color:var(--faint);margin-left:3px}
  .alarm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px dashed #e8eef2;background:none;padding:10px 0;text-align:left}
  .alarm-row:last-child{border-bottom:0}
  .alarm-row.active{background:#f1faf9}
  .alarm-row b{display:block;font-size:13px}
  .alarm-row .src{font-size:11.5px;color:var(--faint)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .tile{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:8px}
  .tile.active{border-color:var(--accent);background:#f1faf9}
  .chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:8px;background:#f8fbfc;border-radius:8px}
  .chart i{flex:1;background:#bfe0dc;border-radius:3px 3px 0 0}
  .layout.cust{grid-template-columns:1fr}
  .cust-shell{position:relative;min-height:calc(100vh - 92px)}
  .cust-canvas{padding:22px 28px 80px;max-width:1280px;margin:0 auto}
  .cust-shell.tree-open .cust-canvas{padding-left:286px}
  .cust-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:10px}
  .cust-head .kicker{font-size:11px;letter-spacing:.12em;color:var(--faint)}
  .cust-head h1{font-size:26px;margin:4px 0 0}
  .cust-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .cust-tools{display:flex;gap:6px}
  .cust-tools .ghost{padding:5px 10px;font-size:12px}
  .cust-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);
    padding:7px 12px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .cust-meta b{color:var(--muted);font-weight:600}
  .alarm-strip{display:flex;align-items:center;gap:12px;padding:7px 12px;border:1px solid #efdcc8;background:#fdf5ec;
    border-radius:10px;font-size:12px;color:var(--amber);margin-bottom:10px;cursor:pointer}
  .alarm-strip b{font-weight:650}
  .kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:12px}
  .kpi{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;
    box-shadow:0 8px 20px rgba(31,46,58,.06);text-align:left;font:inherit;color:inherit;cursor:pointer}
  .kpi span{font-size:10.5px;color:var(--faint)}
  .kpi b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kpi b em{font-size:11px;font-style:normal;color:var(--faint);margin-left:3px}
  .canvas-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:12px;align-items:start}
  .canvas-grid.one{grid-template-columns:1fr}
  .cfg-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cfg-grid{display:grid;grid-template-columns:290px 1fr;gap:12px;align-items:start}
  .cfg-list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .cfg-list h5{margin:10px 4px 6px;font-size:11px;letter-spacing:.08em;color:var(--faint);font-weight:600}
  .cfg-list h5:first-child{margin-top:2px}
  .cfg-row{display:flex;align-items:center;gap:5px;padding:5px 2px;border-bottom:1px dashed #eef2f5;font-size:12.5px}
  .cfg-row:last-of-type{border-bottom:0}
  .cfg-row .src{font-size:10.5px}
  .cfg-row .ghost{padding:2px 7px;font-size:11px}
  .cfg-preview{min-width:0}
  .cfg-frame{background:linear-gradient(180deg,#eef5f9,#e3edf3);border:1px solid #cddae3;border-radius:12px;padding:10px;max-height:720px;overflow:auto}
  .cfg-frame .cust-canvas{padding:0;max-width:none;margin:0}
  .cfg-frame .cust-head h1{font-size:20px}
  .cfg-frame .kpi-row{gap:6px}
  .cfg-frame .kpi{padding:7px 8px}
  .cfg-frame .kpi span{font-size:9.5px}
  .cfg-frame .kpi b{font-size:15px}
  .cfg-frame .canvas-grid{grid-template-columns:1.5fr 1fr;gap:8px}
  .cfg-frame .screen-card{padding:11px}
  .cfg-frame .chart{height:64px}
  .cfg-frame .cust-meta{gap:10px;font-size:10.5px}
  .bind-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
  .bind-head b{font-size:14px}
  .bind-head span{font-size:11px;color:var(--faint)}
  .bind-head button{margin-left:auto;border:0;background:none;font-size:17px;color:var(--faint);cursor:pointer}
  .bind-opt{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;
    border-bottom:1px dashed #eef2f5;cursor:pointer}
  .bind-opt input{accent-color:var(--accent)}
  .cfg-list .chips{margin:6px 0 2px}
  .chip.ok{border-color:#cfe6dc;color:var(--mint);background:#eef8f3}
  .chip.warn{border-color:#efdcc8;color:var(--amber);background:#fdf5ec}
  .tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .tpl-card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;
    background:#fff;padding:11px 12px;text-align:left}
  .tpl-card:hover{border-color:#bcd7d5}
  .tpl-card.active{border-color:var(--accent);background:#f1faf9}
  .tpl-card b{font-size:13px}
  .tpl-card span{font-size:11.5px;color:var(--muted)}
  .tpl-card small{font-size:10.5px;color:var(--faint)}
  .outline{border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px 10px}
  .outline .row{padding:4px 0;font-size:12.5px}
  .check-strip{display:flex;gap:6px;flex-wrap:wrap}
  .ledger-table td{font-size:12px}
  .ledger-table .row-actions{white-space:nowrap;text-align:right}
  .row-actions .ghost{padding:2px 7px;font-size:11px;margin-left:4px}
  .acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .acc-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px}
  .acc-card.wide{grid-column:1 / -1}
  .acc-card h5{margin:0 0 8px;font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
  .acc-card h5 .src{font-weight:400;letter-spacing:0}
  .pick{display:flex;flex-direction:column;gap:3px;width:100%;border:1px solid var(--line);border-radius:9px;
    background:#fff;padding:8px 10px;text-align:left;margin-bottom:6px}
  .pick.active{border-color:var(--accent);background:#f1faf9}
  .pick b{font-size:12.5px}
  .pick small{font-size:10.5px;color:var(--faint)}
  .ok-text{color:var(--mint)}
  .warn-text{color:var(--amber)}
  .rules-table tr.hit td{background:#f6fbf7}
  .rules-table .row-actions{white-space:nowrap}
  .rule-form{border:1px solid #cfe0ea;background:#f1f8fb;border-radius:10px;padding:10px 12px;margin:8px 0}
  .rule-form h5{margin:0 0 8px;font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
  .rule-fields{display:flex;gap:16px;flex-wrap:wrap}
  .rule-fields label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .rule-fields select,.rule-fields input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;
    font:inherit;font-size:12px;background:#fff}
  .rule-fields input[type=number]{width:88px}
  .sim{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .sim label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--faint)}
  .sim label b{color:var(--ink);font-size:14px}
  .sim input[type=range]{width:180px;accent-color:var(--accent)}
  .sim select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;background:#fff}
  .sim label.sim-check{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:12px}
  .sim label.sim-check input{accent-color:var(--accent)}
  .sim-result{display:flex;flex-direction:column;gap:4px;border:1px solid #cfe6dc;background:#eef8f3;
    border-radius:10px;padding:10px 12px;margin-top:10px;font-size:12.5px}
  .search-row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .search-row input{flex:1;max-width:360px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
    font:inherit;font-size:12.5px;background:#fff}
  .batch-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #cfe0ea;
    background:#f1f8fb;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:12.5px}
  .batch-table input{accent-color:var(--accent)}
  .csv-panel{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:12px;background:#fff}
  .csv-panel h5{margin:0 0 8px;font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
  .csv-panel textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font:12px/1.6 ui-monospace,SFMono-Regular,monospace;resize:vertical}
  .canvas-main{display:flex;flex-direction:column;gap:12px;min-width:0}
  .canvas-side{display:flex;flex-direction:column;gap:12px;min-width:0}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
  .stat span{display:block;font-size:10.5px;color:var(--faint)}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums}
  .alarm-mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef2f5}
  .alarm-mini:last-of-type{border-bottom:0}
  .alarm-mini b{display:block;font-size:12.5px}
  .alarm-mini small{font-size:10.5px;color:var(--faint)}
  .alarm-mini .ghost{padding:4px 9px;font-size:11.5px}
  .h5-note{float:right;font-weight:400;font-size:11px;color:var(--accent);cursor:pointer;letter-spacing:0}
  .tree-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3f9d78;margin-right:6px;vertical-align:middle}
  .tree-dot.off{background:#b9c8d4}
  .flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
  .flow i{color:#b9c8d4;font-style:normal;font-size:18px}
  .flow-node{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;
    display:flex;flex-direction:column;gap:6px}
  .flow-node span{font-size:11.5px;color:var(--faint)}
  .flow-node b{font-size:18px}
  .flow-node small{font-size:10.5px;color:var(--faint);line-height:1.4}
  .flow-node.pcc{border-color:#bcd7d5;background:#f1faf9}
  .pipeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
  .pipeline span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--faint)}
  .pipeline span.ok{background:#e6f3ee;border-color:#cfe6dc;color:var(--mint)}
  .pipeline span.cur{border-color:var(--accent);color:var(--accent)}
  .pipeline i{font-style:normal;color:#c3d0da}
  .preview.list{grid-template-columns:1fr}
  .screen-card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:14px;
    padding:16px;box-shadow:0 10px 26px rgba(31,46,58,.07)}
  .screen-card h5{margin:0 0 10px;font-size:12px;color:var(--faint);letter-spacing:.06em;font-weight:600}
  .tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .dev-tile{display:flex;flex-direction:column;gap:5px;border:1px solid var(--line);border-radius:12px;background:#fff;
    padding:13px;text-align:left}
  .dev-tile:hover{border-color:#bcd7d5}
  .dev-tile span{font-size:13px;font-weight:600}
  .dev-tile b{font-size:12px;color:var(--mint);font-weight:600}
  .dev-tile small{font-size:11px;color:var(--faint)}
  .dev-tile .spark{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:2px}
  .dev-tile .spark i{flex:1;background:#bfe0dc;border-radius:1px}
  .cust-tree{position:fixed;left:14px;top:96px;bottom:auto;max-height:calc(100vh - 130px);width:248px;background:rgba(255,255,255,.94);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(31,46,58,.16);padding:10px;z-index:25;overflow:auto}
  .cust-tree h4{margin:6px 8px;font-size:11px;letter-spacing:.1em;color:var(--faint);font-weight:600}
  .cust-node{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--muted)}
  .cust-node:hover{background:#eff6f9}
  .cust-node.active{background:#e2f1f0;color:var(--accent);font-weight:600}
  .cust-node small{color:var(--faint);margin-left:6px}
  .cust-search{padding:4px 6px 8px}
  .cust-search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-size:12px;background:#fff}
  .tree-count{float:right;font-size:10.5px;color:var(--faint);font-weight:400}
  .mini-table{width:100%;border-collapse:collapse;font-size:12px}
  .mini-table th{text-align:left;font-size:10.5px;color:var(--faint);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}
  .mini-table td{padding:7px 8px;border-bottom:1px solid #eef3f6}
  .mini-table tr:last-child td{border-bottom:0}
  .dev-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .dev-tabs button{border:0;background:none;padding:7px 11px;font-size:12.5px;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px}
  .dev-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

function ledger(){
  if (!ledgers[state.project]) {

    copy.id = 'site-' + state.project; copy.name = state.project
    ledgers[state.project] = copy
  }
  return ledgers[state.project]
}
function findNode(node, id){
  if (node.id === id) return node
  for (const child of node.children || []) { const hit = findNode(child, id); if (hit) return hit }
  return null
}
function countDevices(node){
  if (node.kind === '设备') return { total:1, unbound: node.status === '未绑定' ? 1 : 0 }
  return (node.children || []).reduce((acc, child) => {
    const r = countDevices(child)
    return { total: acc.total + r.total, unbound: acc.unbound + r.unbound }
  }, { total:0, unbound:0 })
}
function kindClass(kind){ return kind === '业务单元' ? 'unit' : kind === '设备' ? 'device' : '' }
function selectNode(id){
  state.selD = id; state.page = 'ledger'; state.newFor = null; state.pendingKind = null
  const node = findNode(ledger(), id)
  if ((state.step === 'site' || state.step === 'tree') && node && (node.kind === '设备' || node.kind === '业务单元')) state.step = 'access'
  render()
}
function allowedKinds(node){
  if (node.kind === '设备') return []
  if (node.kind === '业务单元') return ['设备']
  return ['区域','业务单元','设备']
}
function startNew(){
  const node = findNode(ledger(), state.selD) || ledger()
  if (!allowedKinds(node).length) { toast('设备下面不能再建对象'); return }
  state.newFor = node.id; render()

function createUnderRoot(){

function submitNode(){
  const name = $('newName').value.trim(), kind = $('newKind').value
  if (!name) { toast('先填名称'); return }
  const parent = findNode(ledger(), state.newFor); if (!parent) return
  if (!allowedKinds(parent).includes(kind)) { toast('这一层不能建' + kind); return }
  const node = { id:'n' + (nextNodeId++), name, kind, children:[] }
  if (kind === '设备') { node.meta = '未绑定'; node.status = '未绑定' }
  if (kind === '业务单元') node.members = []
  parent.children.push(node); state.selD = node.id; state.newFor = null; state.pendingKind = null; render()
  toast(kind === '设备' ? '已创建设备占位：下一步绑定通道与点位' : '已创建' + kind)

function treeHtml(node, depth){
  const { total, unbound } = countDevices(node)
  const summary = node.kind === '设备'
    ? `<small class="${node.status === '未绑定' ? 'unbound' : ''}">${esc(node.meta || '')}</small>`

      : `<small>设备 ${total}${unbound ? ` · <span class="unbound">未绑定 ${unbound}</span>` : ''}</small>`
  return `

      <span class="node-kind ${kindClass(node.kind)}">${node.kind}</span>${esc(node.name)}${summary}

const AGG_MEMBERS = [
  {name:'1号泵 电流', value:12.4, unit:'A', quality:'有效'},
  {name:'2号泵 电流', value:0, unit:'A', quality:'有效'},
  {name:'水箱液位', value:68, unit:'%', quality:'失效'},

function computeAggregate(){
  const valid = AGG_MEMBERS.filter(m => m.quality === '有效')
  const members = state.agg.quality === 'ignore' ? valid : AGG_MEMBERS
  const values = members.map(m => m.value)
  let value = 0
  if (state.agg.op === 'sum') value = values.reduce((a,b) => a+b, 0)
  if (state.agg.op === 'avg') value = values.length ? values.reduce((a,b) => a+b, 0) / values.length : null
  if (state.agg.op === 'min') value = values.length ? Math.min(...values) : null
  if (state.agg.op === 'max') value = values.length ? Math.max(...values) : null
  if (state.agg.op === 'count') value = members.length
  state.agg.result = {
    value,
    quality: state.agg.quality === 'degrade' && valid.length < AGG_MEMBERS.length ? '降级' : '有效',
    members: members.map(m => m.name),
  }
  state.agg.evaluated = true; render()
}

          <div class="row"><span>窗口</span><span class="src">${windowText}</span></div>

       ['今日运行','6.2','h'],['电流','12.4','A'],['最近变化','2 分钟前','']]
  if (node.kind === '业务单元') return energy
    ? [['储能功率','8.0','kW'],['SOC','76','%'],['成员在线',`${online} / ${total}`,''],
       ['今日充电','28','kWh'],['今日放电','24','kWh'],['通信成功率','99.2%','']]

       ['未接入',String(unbound),'台'],['活动告警',alarms,'条'],['通信成功率','99.2%','']]

       ['今日电量','124','kWh'],['活动告警',alarms,'条'],['通信成功率','99.2%','']]
  if (energy) return [['总功率','20.4','kW'],['今日发电','62','kWh'],['储能 SOC','76','%'],
    ['在线设备',`${online} / ${total}`,''],['活动告警',alarms,'条'],['通信成功率','99.2%','']]
  return [['总功率','12.4','kW'],['今日电量','124','kWh'],['在线设备',`${online} / ${total}`,''],

  return Array.from({ length:30 }, (_, i) => {

    const cells = isDevice
      ? energy
        ? [(8.0 + Math.cos(i / 4) * 0.4).toFixed(1), (750 + Math.sin(i / 5) * 6).toFixed(0),
           (32 + Math.sin(i / 3) * 1.2).toFixed(1)]

function applyBatch(){
  const ids = Object.keys(state.batchSel).filter(id => state.batchSel[id])
  const devices = ids.map(id => findNode(ledger(), id)).filter(d => d && d.status === '未绑定')
  if (!devices.length) { toast('先勾选未绑定设备'); return }
  const used = new Set()
  devices.forEach((d, i) => {
    const station = stationFor(d, i)
    const conflict = used.has(station)
    used.add(station)
    state.batchResult[d.id] = { station, points: pointMapFor(d).length, status: conflict ? '冲突' : '待验证' }
  })
  render(); toast(`已生成 ${devices.length} 台映射草稿；验证逐台进行`)
}
function verifyBatch(){
  const channel = CHANNELS.find(c => c.key === state.batchChannel)
  let ok = 0, fail = 0, conflict = 0
  Object.entries(state.batchResult).forEach(([id, r]) => {
    const device = findNode(ledger(), id)
    if (!device || r.status === '已接入') return
    if (r.status === '冲突') { conflict++; return }
    if (!channel || !channel.online) { r.status = '通道离线'; fail++; return }
    device.status = '在线'
    device.meta = `${(device.meta || '').split(' · ')[0]} · Modbus 站号 ${r.station}`
    r.status = '已接入'; ok++
  })
  render()
  toast(`已接入 ${ok} 台${fail ? `，${fail} 台通道离线` : ''}${conflict ? `，${conflict} 台站号冲突` : ''}`)
}

function previewCsv(){

    else if (!Number.isFinite(station)) result = '站号无效'

    if (result === '可导入') seen.add(station)

const SOURCES = {
  pressure:{ label:'出口压力', unit:'MPa', numeric:true },
  level:{ label:'液位', unit:'%', numeric:true },
  valid:{ label:'采集有效', numeric:false },
  permit:{ label:'运行许可', numeric:false },
}
const ACTIONS = {
  stop_all:'停止全部泵并报警',
  start_pump:'启动 1号泵',
  derate:'降频',
  notify:'通知值班',
}
function defaultRules(){
  return [
    { conditions:[{ source:'valid', value:true }, { source:'level', op:'<', value:10, join:'AND' }],
      hold:0, window:'always', actions:[{ type:'stop_all' }, { type:'notify' }] },
    { conditions:[{ source:'valid', value:true }, { source:'pressure', op:'<', value:0.35, join:'AND' }],
      hold:30, window:'always', actions:[{ type:'start_pump' }] },
    { conditions:[{ source:'valid', value:true }, { source:'pressure', op:'>', value:0.55, join:'AND' }],
      hold:30, window:'always', actions:[{ type:'derate', param:35 }] },
    { conditions:[{ source:'valid', value:true }, { source:'level', op:'>', value:50, join:'AND' }],
      hold:0, window:'daily14', actions:[{ type:'notify' }] },
  ]
}
function rulesFor(node){
  if (!state.rules[node.id]) state.rules[node.id] = defaultRules()
  return state.rules[node.id]
}
function sourceOf(c){ return SOURCES[c.source] || SOURCES.pressure }
function unitSuffix(unit){ return unit === '%' ? '%' : ' ' + unit }
function condValue(c){
  if (c.source === 'pressure') return state.sim.p
  if (c.source === 'level') return state.sim.level
  if (c.source === 'valid') return state.sim.valid
  if (c.source === 'permit') return state.sim.permit
  return 0
}
function condPass(c){
  const v = condValue(c)
  if (!sourceOf(c).numeric) return c.value === true ? v : !v
  return c.op === '<' ? v < c.value : v > c.value
}
function condText(c){
  const s = sourceOf(c)
  if (!s.numeric) return `${s.label} = ${c.value ? '是' : '否'}`
  return `${s.label} ${c.op === '<' ? '&lt;' : '&gt;'} ${c.value}${unitSuffix(s.unit)}`
}
function condReason(c){
  const s = sourceOf(c)
  if (!s.numeric) return `${s.label} 为${condValue(c) ? '是' : '否'}，与期望不符`
  const v = condValue(c)
  return `${s.label} ${v}${unitSuffix(s.unit)} ${c.op === '<' ? '≥' : '≤'} ${c.value}${unitSuffix(s.unit)}`
}
function conditionsText(rule){
  return rule.conditions.map((c, i) => (i ? ` <span class="src">${c.join}</span> ` : '') + condText(c)).join('')
}
function actionText(a){
  if (a.type === 'derate') return `降频到 ${a.param || 35} Hz`
  return ACTIONS[a.type] || a.type
}
function actionsText(rule){
  return rule.actions.map(a => (a.delay ? `等 ${a.delay}s → ` : '') + actionText(a)).join(' → ')
}
function windowText(w){ return { always:'常驻', daily14:'每日 14:00', range16:'16:00–16:05' }[w] || w }
function windowMatch(w){
  if (w === 'always') return true
  if (w === 'daily14') return state.sim.clock === '14:00'
  if (w === 'range16') return state.sim.clock >= '16:00' && state.sim.clock <= '16:05'
  return true
}
function evalRule(rule){
  const results = rule.conditions.map(condPass)
  let ok = results[0]
  for (let i = 1; i < results.length; i++) {
    ok = rule.conditions[i].join === 'OR' ? (ok || results[i]) : (ok && results[i])
  }
  const failed = rule.conditions.find((c, i) => !results[i])
  const reasons = []
  if (!ok && failed) reasons.push(condReason(failed))
  if (ok && state.sim.held < rule.hold) reasons.push(`已持续 ${state.sim.held}s &lt; ${rule.hold}s`)
  if (ok && !windowMatch(rule.window)) reasons.push(`不在时间窗（${windowText(rule.window)}）`)
  return { pass: ok && state.sim.held >= rule.hold && windowMatch(rule.window), reasons }

  const key = r => JSON.stringify(r.conditions.map(c => [c.source, c.op, c.value, c.join || '']))

function hitIndex(rules){ return rules.findIndex(rule => evalRule(rule).pass) }
function runSim(){

            {from:'放电',event:'SOC ≤ 15%',guard:'SOC ≤ 15%',to:'待机',action:'停止放电'},

          ]
        : [

function machineGuard(guard){
  if (!guard || guard === '—') return true
  if (guard.includes('许可') && !state.sim.permit) return false
  if (guard.includes('无故障') && !state.sim.valid) return false
  if (guard === '电流 > 0') return state.sim.current > 0
  if (guard === 'SOC ≥ 95%') return state.sim.soc >= 95
  if (guard === 'SOC ≤ 15%') return state.sim.soc <= 15
  return true

function machineEvent(node, event){
  const machine = machineFor(node), runtime = machineRuntime(node)
  const transition = machine.transitions.find(t => t.from === runtime.current && t.event === event)
    || machine.transitions.find(t => t.from === '任意' && t.event === event)
  if (!transition) {
    runtime.log.unshift(`${runtime.current} · ${event}：没有可用转移，保持`)
  } else if (!machineGuard(transition.guard)) {
    runtime.log.unshift(`${runtime.current} · ${event}：${transition.guard} 不满足，保持`)
  } else {
    const from = runtime.current
    runtime.current = transition.to
    runtime.log.unshift(`${from} → ${transition.to} · ${transition.action}`)
  }
  runtime.log = runtime.log.slice(0, 5)
  render()
}

function newNodeForm(parent){
  return `<div class="card">
    <div class="panel-head"><h3>在「${esc(parent.name)}」下新建</h3></div>
    <label class="note">类型</label>
    <select id="newKind" style="width:100%;padding:8px;border:1px solid #e4e9ee;border-radius:8px">
      ${allowedKinds(parent).map(kind => `<option ${state.pendingKind === kind ? 'selected' : ''}>${kind}</option>`).join('')}
    </select>
    <label class="note">名称</label>
    <input id="newName" placeholder="例如：储能3" style="width:100%;padding:8px;border:1px solid #e4e9ee;border-radius:8px">
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="tag" style="border-color:#0e7c7b;color:#0e7c7b" onclick="submitNode()">创建</button>
      <button class="tag" onclick="state.newFor=null;state.pendingKind=null;render()">取消</button>
    </div>
    <p class="note">设备先建成占位；绑定通道与点位之前，它不会出现在客户画面与统计里。</p>
  </div>`
}

/* ---------- 行业包 ---------- */
function industryPage(){
  if (!state.ems) {
    return `<div class="variant-head"><b>行业包</b><span>本站启用了什么行业能力？</span></div>
      <div class="banner">EMS 行业包未启用：功率分配等页面不可达；底座功能不受影响。
        <button onclick="setEms(true)">启用</button></div>
      <div class="card"><div class="panel-head"><h3>EMS 行业包</h3><span class="tag">未启用</span></div>
        <p class="note">停用不删除已配置的能源对象；再次启用时它们仍在。启用不等于购买（ADR 0003）。</p></div>`
  }
  return `<div class="variant-head"><b>行业包</b><span>本站启用了什么行业能力？</span></div>
    <div class="card"><div class="panel-head"><h3>EMS 行业包</h3><span class="tag ok">已启用</span><span class="tag">ems@1.0.0</span></div>
      <div class="row"><span>能源单元、设备与能力约束</span><span class="src">对象类型</span></div>
      <div class="row"><span>能源策略与电站级目标</span><span class="src">策略模板</span></div>
      <div class="row"><span>功率分配、仲裁与联合调度</span><span class="src">策略</span></div>
      <div class="row"><span>需量窗口与 96 点计划</span><span class="src">策略</span></div>
      <button class="tag" style="margin-top:12px" onclick="setEms(false)">停用（不删除数据）</button>
    </div>`
}

document.addEventListener('click', e => {
  const stage = e.target.closest('[data-stage]')
  if (stage) setAccessStage(stage.dataset.stage)
})
render()
</script>
</body>
</html>
